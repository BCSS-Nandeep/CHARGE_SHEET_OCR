<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Results — {{ document_id }}</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <div>
        <h1>{{ app_name }}</h1>
        <div class="sub">Extraction results</div>
      </div>
      <nav>
        <a href="/">Upload</a>
        <a href="/history">History</a>
        <a href="/docs" target="_blank">API Docs</a>
      </nav>
    </header>

    <div class="card">
      <h2>Document</h2>
      <div id="doc-meta"><p class="muted">Loading…</p></div>
      <div id="poll-note" class="alert info hidden"></div>
    </div>

    <div id="results-root"></div>
  </div>
  <script src="/static/js/app.js"></script>
  <script>ChargeSheetApp.initResultsPage({{ document_id | tojson }});</script>
</body>
</html>
